name: Native Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build with Maven
        run: mvn clean package -Pnative -pl web-layer -am
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-layer-native-binary
          path: web-layer/target/*-runner
