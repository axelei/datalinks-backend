# === Datasource for tests ===
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:datalinks;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import-test.sql

# === Mailer for tests ===
quarkus.mailer.mock=true
quarkus.mailer.log=true
quarkus.mailer.host=localhost
quarkus.mailer.port=8025
quarkus.mailer.from=test@example.com

# === App config for tests ===
application.sitename=Datalinks Test
application.upload.dir=./target/uploads
application.url=http://localhost:8081
application.backend.url=http://localhost:8081
google.recaptcha.key.secret=dummy-secret
google.recaptcha.key.site=dummy-site

# Search index for tests
application.search.index-dir=./target/lucene-index
