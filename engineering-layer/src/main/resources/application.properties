# === Hibernate Search (Elasticsearch) ===
# Conexin al cluster ES. Configurar en datalinks.properties.
quarkus.hibernate-search-orm.elasticsearch.version=8
quarkus.hibernate-search-orm.elasticsearch.hosts=localhost:9200
quarkus.hibernate-search-orm.elasticsearch.protocol=http
quarkus.hibernate-search-orm.indexing.plan.synchronization.strategy=write-sync
# Indexacin manual: equivale a spring.jpa.properties.hibernate.search.indexing.strategy=manual
quarkus.hibernate-search-orm.automatic-indexing=false
quarkus.hibernate-search-orm.schema-management.strategy=drop-and-create-and-drop
quarkus.hibernate-search-orm.elasticsearch.analysis.analysis.configurer=bean:ngramAnalysisConfigurer
quarkus.hibernate-search-orm.elasticsearch.analysis.version=8.15

# === Mailer ===
quarkus.mailer.from=
quarkus.mailer.host=
quarkus.mailer.port=
quarkus.mailer.username=
quarkus.mailer.password=
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.auth-methods=

# === Cache (Caffeine en Quarkus por defecto) ===
quarkus.cache.caffeine."configlets".expire-after-write=10M
quarkus.cache.caffeine."config".expire-after-write=10M
quarkus.cache.caffeine."pageCount".expire-after-write=1M

application.upload.dir=
application.sitename=
