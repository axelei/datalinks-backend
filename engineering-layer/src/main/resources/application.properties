# === Búsqueda (Apache Lucene embebido) ===
# Directorio donde se persiste el índice Lucene. Configurable en datalinks.properties.
application.search.index-dir=./data/lucene-index

# === Mailer ===
quarkus.mailer.from=
quarkus.mailer.host=
quarkus.mailer.port=
quarkus.mailer.username=
